            const base = document.getElementById('boardbase');

            for (i=0; i<14;i++){
                let row = document.createElement('div');
                row.className='row';
                
                if ([1,6,11].includes(i)){
                    row.style.setProperty('margin-bottom','12px');
                }
                
                for (j=0; j<63; j++){
                    let hole = document.createElement('div');
                    hole.className = 'hole';
                    row.appendChild(hole);
                    if ([0,1,12,13].includes(i)&& [0,1,7,13,19,25,31,37,43,49,55,61,62].includes(j)){
                        hole.style.setProperty('background','transparent');

                holes.appendChild(row);

            const leds = document.getElementsByClassName('led');

            }

            for (m=0; m<2; m++){

                circ.className='circ';
                if (m==0){
                    circ.style.setProperty('top', '10px');

                }
                else{

                circ.style.setProperty('left','10px');
